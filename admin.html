<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка — Новосельские истории</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --color-water-deep: #2B6B7A; --color-water-light: #7FB5C0; --color-bank: #C9A66B;
            --color-bg: #F5F1E8; --color-text: #2C2C2C; --color-accent: #A85A3C;
            --font-heading: 'Playfair Display', Georgia, serif; --font-body: 'Inter', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); color: var(--color-text); background-color: var(--color-bg); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
        
        .admin-header { background: var(--color-water-deep); color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .admin-header h1 { font-family: var(--font-heading); font-size: 1.5rem; }
        .logout-btn { background: var(--color-accent); color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
        .logout-btn:hover { background: #8a4a31; }

        .admin-container { max-width: 1000px; margin: 2rem auto; padding: 0 1.5rem; flex: 1; }
        
        .login-screen { max-width: 400px; margin: 10vh auto; background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); text-align: center; }
        .login-screen h2 { font-family: var(--font-heading); color: var(--color-water-deep); margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 0.3rem; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.7rem; border: 1px solid #ccc; border-radius: 6px; font-family: var(--font-body); font-size: 0.95rem; }
        .btn-primary { width: 100%; padding: 0.8rem; background: var(--color-water-deep); color: white; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; transition: background 0.3s; }
        .btn-primary:hover { background: #1f5563; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        .dashboard { display: none; }
        .dashboard.active { display: block; }
