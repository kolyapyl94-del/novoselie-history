<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Устная история — Новосельские истории</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --color-water-deep: #2B6B7A; --color-water-light: #7FB5C0; --color-bank: #C9A66B;
            --color-bg: #F5F1E8; --color-text: #2C2C2C; --color-accent: #A85A3C;
            --font-heading: 'Playfair Display', Georgia, serif; --font-body: 'Inter', -apple-system, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); color: var(--color-text); background-color: var(--color-bg); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
        
        .site-header { position: fixed; top: 0; left: 0; right: 0; background: rgba(245, 241, 232, 0.95); backdrop-filter: blur(8px); z-index: 1000; padding: 1rem 2rem; box-shadow: 0 2px 15px rgba(0,0,0,0.06); border-bottom: 1px solid rgba(201, 166, 107, 0.3); }
        .header-content { max-width: 1300px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .site-title { font-family: var(--font-heading); font-size: 1.6rem; font-weight: 700; color: var(--color-water-deep); text-decoration: none; }
        .main-nav { display: flex; gap: 1.2rem; flex-wrap: wrap; }
        .nav-link { font-size: 0.9rem; color: var(--color-text); text-decoration: none; transition: color 0.3s ease; position: relative; }
        .nav-link:hover, .nav-link.active { color: var(--color-accent); }
        .nav-link.active::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 100%; height: 2px; background: var(--color-accent); }

        .page-content { flex: 1; padding-top: 100px; padding-bottom: 3rem; width: 100%; max-width: 1000px; margin: 0 auto; padding-left: 2rem; padding-right: 2rem; }
        
        .page-header { margin-bottom: 2rem; text-align: center; }
        .breadcrumbs { font-size: 0.85rem; color: var(--color-accent); margin-bottom: 0.5rem; }
        .breadcrumbs a { color: var(--color-accent); text-decoration: none; }
        .breadcrumbs a:hover { text-decoration: underline; }
        .page-title { font-family: var(--font-heading); font-size: 2.5rem; color: var(--color-water-deep); margin-bottom: 1rem; }
        .page-subtitle { font-size: 1.1rem; color: var(--color-text); opacity: 0.8; max-width: 600px; margin: 0 auto; }

        .stories-list { margin-top: 2rem; }

        .story-card { background: white; border-radius: 10px; padding: 2rem; margin-bottom: 2rem; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .story-header { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; align-items: flex-start; }
        .narrator-photo { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; filter: sepia(0.3); flex-shrink: 0; }
        .narrator-info { flex: 1; }
        .narrator-info h3 { font-family: var(--font-heading); font-size: 1.3rem; color: var(--color-water-deep); margin-bottom: 0.3rem; }
        .narrator-info p { font-size: 0.9rem; opacity: 0.7; margin-bottom: 0.5rem; }
        .story-title { font-family: var(--font-heading); font-size: 1.5rem; color: var(--color-text); font-style: italic; margin-bottom: 1rem; }
        
        .story-content { font-size: 1.05rem; line-height: 1.8; margin-bottom: 1.5rem; }
        .story-content p { margin-bottom: 1rem; }
        .story-content blockquote { border-left: 3px solid var(--color-bank); padding-left: 1rem; margin: 1rem 0; font-style: italic; opacity: 0.9; }
        .story-content ul, .story-content ol { margin-left: 2rem; margin-bottom: 1rem; }
        
        .story-date { font-size: 0.85rem; opacity: 0.6; margin-bottom: 1rem; }

        .audio-player { background: var(--color-bg); padding: 1rem; border-radius: 8px; display: flex; align-items: center; gap: 1rem; }
        .audio-player audio { flex: 1; }
        
        .loading-state, .empty-state { text-align: center; padding: 3rem; font-size: 1.1rem; opacity: 0.6; }

        .site-footer { background: var(--color-water-deep); color: white; text-align: center; padding: 1.5rem; margin-top: auto; }
        .site-footer p { margin: 0.3rem 0; opacity: 0.85; font-size: 0.85rem; }

        @media (max-width: 768px) {
            .header-content { flex-direction: column; align-items: center; }
            .page-title { font-size: 2rem; }
            .story-header { flex-direction: column; align-items: center; text-align: center; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <a href="index.html" class="site-title">Новосельские истории</a>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">Главная</a>
                <a href="photos.html" class="nav-link">Фото</a>
                <a href="oral-history.html" class="nav-link active">Истории</a>
                <a href="articles.html" class="nav-link">Статьи</a>
                <a href="events.html" class="nav-link">Мероприятия</a>
                <a href="about.html" class="nav-link">О музее</a>
            </nav>
        </div>
    </header>

    <main class="page-content">
        <div class="page-header">
            <div class="breadcrumbs"><a href="index.html">Главная</a> / Устная история</div>
            <h1 class="page-title">Голоса Новоселья</h1>
            <p class="page-subtitle">Записи интервью с жителями — живые воспоминания о быте, работе и жизни в деревне</p>
        </div>

        <div id="storiesList" class="stories-list">
            <div class="loading-state">Загрузка историй...</div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <p>&copy; 2026 Новосельские истории. Цифровой музей.</p>
            <p>Создано с любовью к родной земле</p>
        </div>
    </footer>

    <script>
        const SUPABASE_URL = 'https://ecuigoitabccnmsufijk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjdWlnb2l0YWJjY25tc3VmaWprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NTAyNDksImV4cCI6MjEwNjQyNjI0OX0.yNsGLXMy11f6WNf8YozBMfOCF4bGSTXEW0fOqvjizTY';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadStories() {
            const listContainer = document.getElementById('storiesList');
            
            const { data, error } = await sb
                .from('oral_histories')
                .select('*')
                .eq('is_published', true)
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Ошибка загрузки:', error);
                listContainer.innerHTML = '<div class="empty-state">Не удалось загрузить истории.</div>';
                return;
            }

            if (data.length === 0) {
                listContainer.innerHTML = '<div class="empty-state">Пока нет опубликованных историй. Загляните в админку!</div>';
                return;
            }

            listContainer.innerHTML = data.map(oral => `
                <div class="story-card">
                    <div class="story-header">
                        ${oral.narrator_photo_url ? `<img src="${oral.narrator_photo_url}" alt="${oral.narrator_name}" class="narrator-photo">` : ''}
                        <div class="narrator-info">
                            <h3>${oral.narrator_name}</h3>
                            ${oral.narrator_bio ? `<p>${oral.narrator_bio}</p>` : ''}
                        </div>
                    </div>
                    <h2 class="story-title">«${oral.title}»</h2>
                    <div class="story-content">${oral.content}</div>
                    ${oral.interview_date ? `<p class="story-date">Интервью записано: ${formatDate(oral.interview_date)}</p>` : ''}
                    ${oral.audio_url ? `
                        <div class="audio-player">
                            <span>🎧 Аудиозапись:</span>
                            <audio controls src="${oral.audio_url}"></audio>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return date.toLocaleDateString('ru-RU', options);
        }

        document.addEventListener('DOMContentLoaded', loadStories);
    </script>
</body>
</html>
