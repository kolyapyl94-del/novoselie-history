<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новоселье в снимках — Новосельские истории</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --color-water-deep: #2B6B7A; --color-water-light: #7FB5C0; --color-bank: #C9A66B;
            --color-bg: #F5F1E8; --color-text: #2C2C2C; --color-accent: #A85A3C;
            --font-heading: 'Playfair Display', Georgia, serif; --font-body: 'Inter', -apple-system, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); color: var(--color-text); background-color: var(--color-bg); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
        
        .site-header { position: fixed; top: 0; left: 0; right: 0; background: rgba(245, 241, 232, 0.95); backdrop-filter: blur(8px); z-index: 1000; padding: 1rem 2rem; box-shadow: 0 2px 15px rgba(0,0,0,0.06); border-bottom: 1px solid rgba(201, 166, 107, 0.3); }
        .header-content { max-width: 1300px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .site-title { font-family: var(--font-heading); font-size: 1.6rem; font-weight: 700; color: var(--color-water-deep); text-decoration: none; }
        .main-nav { display: flex; gap: 1.2rem; flex-wrap: wrap; }
        .nav-link { font-size: 0.9rem; color: var(--color-text); text-decoration: none; transition: color 0.3s ease; position: relative; }
        .nav-link:hover, .nav-link.active { color: var(--color-accent); }
        .nav-link.active::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 100%; height: 2px; background: var(--color-accent); }

        .page-content { flex: 1; padding-top: 100px; padding-bottom: 3rem; width: 100%; max-width: 1200px; margin: 0 auto; padding-left: 2rem; padding-right: 2rem; }
        
        .page-header { margin-bottom: 2rem; text-align: center; }
        .breadcrumbs { font-size: 0.85rem; color: var(--color-accent); margin-bottom: 0.5rem; }
        .breadcrumbs a { color: var(--color-accent); text-decoration: none; }
        .breadcrumbs a:hover { text-decoration: underline; }
        .page-title { font-family: var(--font-heading); font-size: 2.5rem; color: var(--color-water-deep); margin-bottom: 1rem; }
        .page-subtitle { font-size: 1.1rem; color: var(--color-text); opacity: 0.8; max-width: 600px; margin: 0 auto; }

        .filter-bar { display: flex; justify-content: center; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 2.5rem; }
        .filter-btn {
            padding: 0.6rem 1.2rem; border: 1px solid var(--color-bank); border-radius: 50px;
            background: transparent; color: var(--color-text); font-family: var(--font-body);
            font-size: 0.9rem; cursor: pointer; transition: all 0.3s ease;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--color-water-deep); color: white; border-color: var(--color-water-deep);
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .photo-card {
            background: white; border-radius: 8px; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); transition: all 0.4s ease;
            cursor: pointer;
        }
        .photo-card.hidden { display: none; }
        .photo-card:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(43, 107, 122, 0.2); }

        .photo-wrapper { position: relative; overflow: hidden; height: 240px; background: #e0e0e0; }
        .photo-wrapper img {
            width: 100%; height: 100%; object-fit: cover;
            filter: sepia(0.25) contrast(0.95); transition: transform 0.5s ease, filter 0.5s ease;
        }
        .photo-card:hover .photo-wrapper img { transform: scale(1.05); filter: sepia(0) contrast(1); }
        
        /* Иконка лупы при наведении */
        .photo-wrapper::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 2rem;
            opacity: 0;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.9);
            width: 60px; height: 60px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .photo-card:hover .photo-wrapper::after {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .photo-info { padding: 1.2rem; }
        .photo-year {
            display: inline-block; font-size: 0.75rem; font-weight: 600;
            color: var(--color-accent); background: rgba(168, 90, 60, 0.1);
            padding: 0.2rem 0.6rem; border-radius: 4px; margin-bottom: 0.5rem;
        }
        .photo-title { font-family: var(--font-heading); font-size: 1.1rem; color: var(--color-water-deep); margin-bottom: 0.4rem; }
        .photo-desc { font-size: 0.85rem; color: var(--color-text); opacity: 0.75; line-height: 1.5; }
        .photo-author { font-size: 0.8rem; color: var(--color-water-light); margin-top: 0.5rem; font-style: italic; }

        .loading-state, .empty-state { text-align: center; padding: 3rem; font-size: 1.1rem; opacity: 0.6; grid-column: 1 / -1; }

        /* ===== LIGHTBOX (МОДАЛЬНОЕ ОКНО) ===== */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .lightbox.active {
            display: flex;
            opacity: 1;
        }
        
        .lightbox-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .lightbox-img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }
        
        .lightbox-caption {
            color: white;
            text-align: center;
            margin-top: 1rem;
            max-width: 700px;
        }
        .lightbox-caption h3 {
            font-family: var(--font-heading);
            font-size: 1.3rem;
            margin-bottom: 0.3rem;
        }
        .lightbox-caption p {
            font-size: 0.95rem;
            opacity: 0.8;
            line-height: 1.5;
        }
        .lightbox-caption .lb-year {
            color: var(--color-bank);
            font-weight: 600;
            margin-right: 0.5rem;
        }
        
        .lightbox-close {
            position: absolute;
            top: 20px; right: 30px;
            color: white;
            font-size: 2.5rem;
            cursor: pointer;
            background: none;
            border: none;
            transition: transform 0.2s;
            z-index: 10001;
            line-height: 1;
        }
        .lightbox-close:hover { transform: scale(1.2); color: var(--color-bank); }
        
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 3rem;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            border: none;
            width: 60px; height: 60px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
            z-index: 10001;
        }
        .lightbox-nav:hover { background: rgba(255,255,255,0.25); transform: translateY(-50%) scale(1.1); }
        .lightbox-prev { left: 30px; }
        .lightbox-next { right: 30px; }
        
        .lightbox-counter {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .site-footer { background: var(--color-water-deep); color: white; text-align: center; padding: 1.5rem; margin-top: auto; }
        .site-footer p { margin: 0.3rem 0; opacity: 0.85; font-size: 0.85rem; }

        @media (max-width: 768px) {
            .header-content { flex-direction: column; align-items: center; }
            .page-title { font-size: 2rem; }
            .photo-grid { grid-template-columns: 1fr; }
            .lightbox-nav { width: 45px; height: 45px; font-size: 2rem; }
            .lightbox-prev { left: 10px; }
            .lightbox-next { right: 10px; }
            .lightbox-close { top: 10px; right: 15px; font-size: 2rem; }
            .lightbox-caption h3 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <a href="index.html" class="site-title">Новосельские истории</a>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">Главная</a>
                <a href="photos.html" class="nav-link active">Фото</a>
                <a href="oral-history.html" class="nav-link">Истории</a>
                <a href="articles.html" class="nav-link">Статьи</a>
                <a href="events.html" class="nav-link">Мероприятия</a>
                <a href="about.html" class="nav-link">О музее</a>
            </nav>
        </div>
    </header>

    <main class="page-content">
        <div class="page-header">
            <div class="breadcrumbs"><a href="index.html">Главная</a> / Новоселье в снимках</div>
            <h1 class="page-title">Фотоархив Новоселья</h1>
            <p class="page-subtitle">Кликните на фотографию, чтобы рассмотреть её в полном размере</p>
        </div>

        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="people">Люди и семьи</button>
            <button class="filter-btn" data-filter="archive">Пейзажи и быт</button>
            <button class="filter-btn" data-filter="melioration">Мелиорация</button>
        </div>

        <div id="photoGrid" class="photo-grid">
            <div class="loading-state">Загрузка архива...</div>
        </div>
    </main>

    <!-- Lightbox (модальное окно для просмотра фото) -->
    <div id="lightbox" class="lightbox">
        <button class="lightbox-close" id="lightboxClose">&times;</button>
        <button class="lightbox-nav lightbox-prev" id="lightboxPrev">&#8249;</button>
        <button class="lightbox-nav lightbox-next" id="lightboxNext">&#8250;</button>
        
        <div class="lightbox-content">
            <img id="lightboxImg" class="lightbox-img" src="" alt="">
            <div class="lightbox-caption">
                <h3 id="lightboxTitle"></h3>
                <p id="lightboxDesc"></p>
            </div>
        </div>
        <div class="lightbox-counter" id="lightboxCounter"></div>
    </div>

    <footer class="site-footer">
        <div class="footer-content">
            <p>&copy; 2026 Новосельские истории. Цифровой музей.</p>
            <p>Создано с любовью к родной земле</p>
        </div>
    </footer>

    <script>
        const SUPABASE_URL = 'https://ecuigoitabccnmsufijk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjdWlnb2l0YWJjY25tc3VmaWprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NTAyNDksImV4cCI6MjEwNjQyNjI0OX0.yNsGLXMy11f6WNf8YozBMfOCF4bGSTXEW0fOqvjizTY';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allPhotos = [];
        let currentPhotoIndex = 0;
        let currentFilteredPhotos = [];

        // Загрузка фотографий
        async function loadPhotos() {
            const grid = document.getElementById('photoGrid');
            
            const { data, error } = await sb
                .from('photos')
                .select('*')
                .eq('is_published', true)
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Ошибка загрузки:', error);
                grid.innerHTML = '<div class="empty-state">Не удалось загрузить фотографии.</div>';
                return;
            }

            allPhotos = data || [];
            currentFilteredPhotos = allPhotos;

            if (allPhotos.length === 0) {
                grid.innerHTML = '<div class="empty-state">Архив пока пуст. Загляните в админку, чтобы добавить первые фотографии!</div>';
                return;
            }

            renderPhotos(allPhotos);
        }

        function renderPhotos(photos) {
            const grid = document.getElementById('photoGrid');
            grid.innerHTML = photos.map((photo, index) => `
                <div class="photo-card" data-section="${photo.section}" data-index="${index}">
                    <div class="photo-wrapper">
                        <img src="${photo.file_url}" alt="${photo.title}" loading="lazy">
                    </div>
                    <div class="photo-info">
                        ${photo.year ? `<span class="photo-year">${photo.year} г.</span>` : ''}
                        <h3 class="photo-title">${photo.title}</h3>
                        <p class="photo-desc">${photo.description || 'Описание отсутствует'}</p>
                        ${photo.author ? `<p class="photo-author">Источник: ${photo.author}</p>` : ''}
                    </div>
                </div>
            `).join('');

            // Добавляем обработчики клика на карточки
            document.querySelectorAll('.photo-card').forEach(card => {
                card.addEventListener('click', () => {
                    const index = parseInt(card.getAttribute('data-index'));
                    openLightbox(index);
                });
            });
        }

        // ===== LIGHTBOX ФУНКЦИИ =====
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxTitle = document.getElementById('lightboxTitle');
        const lightboxDesc = document.getElementById('lightboxDesc');
        const lightboxCounter = document.getElementById('lightboxCounter');

        function openLightbox(index) {
            currentPhotoIndex = index;
            updateLightboxContent();
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden'; // Блокируем прокрутку страницы
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = ''; // Возвращаем прокрутку
        }

        function updateLightboxContent() {
            const photo = currentFilteredPhotos[currentPhotoIndex];
            if (!photo) return;
            
            lightboxImg.src = photo.file_url;
            lightboxImg.alt = photo.title;
            lightboxTitle.textContent = photo.title;
            lightboxDesc.innerHTML = `
                ${photo.year ? `<span class="lb-year">${photo.year} г.</span>` : ''}
                ${photo.description || ''}
                ${photo.author ? `<br><em>Источник: ${photo.author}</em>` : ''}
            `;
            lightboxCounter.textContent = `${currentPhotoIndex + 1} / ${currentFilteredPhotos.length}`;
        }

        function nextPhoto() {
            currentPhotoIndex = (currentPhotoIndex + 1) % currentFilteredPhotos.length;
            updateLightboxContent();
        }

        function prevPhoto() {
            currentPhotoIndex = (currentPhotoIndex - 1 + currentFilteredPhotos.length) % currentFilteredPhotos.length;
            updateLightboxContent();
        }

        // Обработчики событий для lightbox
        document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
        document.getElementById('lightboxNext').addEventListener('click', (e) => { e.stopPropagation(); nextPhoto(); });
        document.getElementById('lightboxPrev').addEventListener('click', (e) => { e.stopPropagation(); prevPhoto(); });
        
        // Закрытие по клику на фон
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        // Управление с клавиатуры
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') nextPhoto();
            if (e.key === 'ArrowLeft') prevPhoto();
        });

        // Фильтрация
        document.addEventListener('DOMContentLoaded', () => {
            loadPhotos();

            const filterBtns = document.querySelectorAll('.filter-btn');

            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    const filterValue = btn.getAttribute('data-filter');

                    if (filterValue === 'all') {
                        currentFilteredPhotos = allPhotos;
                    } else {
                        currentFilteredPhotos = allPhotos.filter(photo => photo.section === filterValue);
                    }
                    
                    renderPhotos(currentFilteredPhotos);
                });
            });
        });
    </script>
</body>
</html>
